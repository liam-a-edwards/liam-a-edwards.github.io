cv:
  name: Liam Edwards
  label: DPhil Student, University of Oxford
  email: liam@robots.ox.ac.uk
  summary: DPhil student in the AIMS CDT at the University of Oxford, working with Ingmar Posner (A2I) and Andrea Vedaldi (VGG) on vision and world modeling for robotic manipulation. Background in mechanical engineering and robot learning, spanning diffusion-policy manipulation, sim2sim validation for humanoid locomotion, and LLM methods for biomedical reasoning.


  address:
    city: Oxford
    region: UK

  sections:
    Education:
      - institution: University of Oxford
        location: Oxford, UK
        url: https://aims.robots.ox.ac.uk/
        area: Autonomous Intelligent Machines and Systems (AIMS) CDT
        studyType: DPhil
        start_date: 2026-10
        highlights:
          - "Supervisors: Ingmar Posner and Andrea Vedaldi"

      - institution: University of California, Los Angeles (UCLA)
        location: Los Angeles, CA
        area: Mechanical Engineering
        studyType: B.S. and M.S.
        start_date: 2021-09
        end_date: 2026-06

    Experience:
      - company: UCLA
        position: Robust Machine Learning and Mechanobioengineering
        location: Los Angeles, CA
        start_date: 2023-09
        end_date: 2026-10
        summary: "Advisors: Neil Lin and Cho-Jui Hsieh"
        highlights:
          - Developed PairLLM, a comparative fine-tuning approach that teaches language models signed property differences between molecule pairs and recombines them into a common ranking via least squares. Outperformed pointwise prediction on scaffold-disjoint toxicity, permeability, and solubility benchmarks with only 50–100 fine-tuning compounds per property. (First-author manuscript, submitted to *PNAS Nexus*)
          - Developed an autonomous prompt-evolution framework enabling LLMs to perform interpretable, evidence-linked diagnostic reasoning for cancer pathology classification, and contributed to mechanism-informed language modeling and oxygenated 3D screening that identified berberine–enzalutamide synergy in prostate cancer models. (Published in *Communications Medicine* and *Advanced Science*)

      - company: UCLA
        position: Robotics & Mechanisms Laboratory (RoMeLa)
        location: Los Angeles, CA
        start_date: 2024-11
        end_date: 2025-09
        summary: "Advisor: Dennis Hong"
        highlights:
          - Built a robust Isaac Sim–based sim2sim pipeline for a humanoid with challenging mass distribution and mobility constraints, providing a safe, controlled environment to validate locomotion policies pre-deployment. (Published at *IEEE-RAS International Conference on Humanoid Robots*)
          - Implemented an Isaac Sim replay system to analyze robot data, streamlining debugging and validating policy performance without hardware risk.

      - company: UC Berkeley
        position: Mechanical Systems Control Lab
        location: Berkeley, CA
        start_date: 2023
        end_date: 2024
        summary: "Advisor: Masayoshi Tomizuka (Summers 2023, 2024)"
        highlights:
          - Designed and trained a diffusion policy to perform manipulation tasks with 6D object pose estimation and explored an object-centric task segmentation framework to assist in long-horizon task planning.
          - Developed a custom ROS2 framework to handle data collection and processing, motion planning, and TCP/IP control.

